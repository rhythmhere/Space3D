<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Journey | Solar System Explorer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#f0f0f0;font-family:'Inter',sans-serif;overflow:hidden;height:100vh;width:100vw;}
#intro{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;background:radial-gradient(ellipse at center, #0a0a15 0%, #000 100%);transition:opacity 1s ease;}
#intro h1{font-family:'Cormorant Garamond',serif;font-size:2.8rem;font-weight:400;letter-spacing:2px;margin-bottom:2.5rem;text-align:center;max-width:800px;line-height:1.4;opacity:0;}
#start-btn{background:transparent;border:1px solid rgba(240,240,240,0.3);color:#f0f0f0;padding:14px 42px;font-family:'Inter',sans-serif;font-size:1.1rem;letter-spacing:1px;cursor:pointer;border-radius:30px;transition:all 0.4s ease;opacity:0;backdrop-filter:blur(2px);}
#start-btn:hover{background:rgba(255,255,255,0.08);border-color:rgba(240,240,240,0.6);transform:translateY(-2px);}
#transition-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;z-index:20;opacity:0;pointer-events:none;}
#transition-overlay h2{font-family:'Cormorant Garamond',serif;font-size:3.5rem;font-weight:600;letter-spacing:4px;opacity:0;}
#solar-system-container{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;opacity:0;}
#info-panel{position:absolute;top:50%;right:5%;transform:translateY(-50%) translateX(120%);width:380px;background:rgba(10,10,20,0.85);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:30px;backdrop-filter:blur(10px);z-index:30;transition:transform 0.6s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 10px 30px rgba(0,0,0,0.5);}
#info-panel.visible{transform:translateY(-50%) translateX(0);}
#info-panel h2{font-family:'Cormorant Garamond',serif;font-size:2.2rem;margin-bottom:15px;color:#e0e0e0;}
#info-panel .planet-image{width:100%;height:180px;background-size:cover;background-position:center;border-radius:8px;margin:15px 0 25px;border:1px solid rgba(255,255,255,0.08);}
#info-panel .stats{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:25px;}
.stat-item{padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.08);}
.stat-label{font-size:0.85rem;color:#aaa;margin-bottom:4px;}
.stat-value{font-size:1.1rem;font-weight:500;}
#info-panel .facts{font-size:0.95rem;line-height:1.6;color:#d0d0d0;}
#close-btn{position:absolute;top:20px;right:20px;background:transparent;border:none;color:#aaa;font-size:1.4rem;cursor:pointer;width:30px;height:30px;display:flex;justify-content:center;align-items:center;border-radius:50%;transition:all 0.3s ease;}
#close-btn:hover{color:#fff;background:rgba(255,255,255,0.1);}
.loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#777;font-size:1.2rem;opacity:0;}
canvas{display:block;}
#watermark {position: fixed; bottom: 12px; right: 12px; font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: rgba(255,255,255,0.3); pointer-events: none; user-select: none; z-index: 50;}
@media(max-width:768px){#intro h1{font-size:2rem;padding:0 20px;}#start-btn{padding:12px 30px;font-size:1rem;}#info-panel{width:90%;right:50%;transform:translateX(50%) translateY(-50%);padding:20px;}#info-panel.visible{transform:translateX(-50%) translateY(-50%);}#info-panel h2{font-size:1.8rem;}}
</style>
</head>
<body>
<div id="intro">
    <h1>Let’s explore the Solar System.</h1>
    <button id="start-btn">Start Journey</button>
    <div class="loading">Loading cosmic data...</div>
</div>

<div id="transition-overlay"><h2>THE OG’s Present...</h2></div>

<div id="solar-system-container"></div>

<div id="info-panel">
    <button id="close-btn">×</button>
    <h2 id="planet-name">Planet Name</h2>
    <div id="planet-image" class="planet-image"></div>
    <div class="stats" id="planet-stats"></div>
    <div class="facts" id="planet-facts"></div>
</div>

<div id="watermark">Made by Richardeyyy</div>

<script>
const planetData = {
    mercury:{name:"Mercury",image:"https://upload.wikimedia.org/wikipedia/commons/b/b9/3D_Mercury.png",stats:{"Diameter":"4,879 km","Distance from Sun":"57.9 million km","Gravity":"3.7 m/s²","Moons":"0","Day Length":"59 Earth days","Year Length":"88 Earth days"},facts:"Mercury is the smallest and innermost planet in the Solar System."},
    venus:{name:"Venus",image:"https://upload.wikimedia.org/wikipedia/commons/e/e5/Venus-real_color.jpg",stats:{"Diameter":"12,104 km","Distance from Sun":"108.2 million km","Gravity":"8.87 m/s²","Moons":"0","Day Length":"243 Earth days","Year Length":"225 Earth days"},facts:"Venus is the hottest planet in our solar system."},
    earth:{name:"Earth",image:"https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg",stats:{"Diameter":"12,742 km","Distance from Sun":"149.6 million km","Gravity":"9.8 m/s²","Moons":"1","Day Length":"24 hours","Year Length":"365.25 days"},facts:"Earth is the only known planet to support life."},
    mars:{name:"Mars",image:"https://upload.wikimedia.org/wikipedia/commons/0/02/OSIRIS_Mars_true_color.jpg",stats:{"Diameter":"6,779 km","Distance from Sun":"227.9 million km","Gravity":"3.7 m/s²","Moons":"2","Day Length":"24.6 hours","Year Length":"687 Earth days"},facts:"Mars is known as the Red Planet due to iron oxide."},
    jupiter:{name:"Jupiter",image:"https://upload.wikimedia.org/wikipedia/commons/e/e2/Jupiter.jpg",stats:{"Diameter":"139,820 km","Distance from Sun":"778.5 million km","Gravity":"24.8 m/s²","Moons":"79+","Day Length":"9.9 hours","Year Length":"11.9 Earth years"},facts:"Jupiter is the largest planet with a giant storm called the Great Red Spot."},
    saturn:{name:"Saturn",image:"https://upload.wikimedia.org/wikipedia/commons/c/c7/Saturn_during_Equinox.jpg",stats:{"Diameter":"116,460 km","Distance from Sun":"1.4 billion km","Gravity":"10.4 m/s²","Moons":"82+","Day Length":"10.7 hours","Year Length":"29.5 Earth years"},facts:"Saturn is famous for its ring system made of ice and rock particles."},
    uranus:{name:"Uranus",image:"https://upload.wikimedia.org/wikipedia/commons/3/3d/Uranus2.jpg",stats:{"Diameter":"50,724 km","Distance from Sun":"2.9 billion km","Gravity":"8.7 m/s²","Moons":"27","Day Length":"17.2 hours","Year Length":"84 Earth years"},facts:"Uranus rotates on its side, giving it extreme seasons."},
    neptune:{name:"Neptune",image:"https://upload.wikimedia.org/wikipedia/commons/5/56/Neptune_Full.jpg",stats:{"Diameter":"49,244 km","Distance from Sun":"4.5 billion km","Gravity":"11.2 m/s²","Moons":"14","Day Length":"16.1 hours","Year Length":"165 Earth years"},facts:"Neptune has the strongest winds in the solar system."}
};

let scene,camera,renderer,sun,planets=[],selectedPlanet=null,isTransitioning=false,clock=new THREE.Clock();
const intro=document.getElementById('intro');
const startBtn=document.getElementById('start-btn');
const transitionOverlay=document.getElementById('transition-overlay');
const solarSystemContainer=document.getElementById('solar-system-container');
const infoPanel=document.getElementById('info-panel');
const closeBtn=document.getElementById('close-btn');
const planetName=document.getElementById('planet-name');
const planetImage=document.getElementById('planet-image');
const planetStats=document.getElementById('planet-stats');
const planetFacts=document.getElementById('planet-facts');
const loadingText=document.querySelector('.loading');

function init(){
    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x000000);
    scene.fog=new THREE.Fog(0x000000,200,2000);

    camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,5000);
    camera.position.set(0,50,350);

    renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setSize(window.innerWidth,window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    solarSystemContainer.appendChild(renderer.domElement);

    const ambientLight=new THREE.AmbientLight(0x333333);
    scene.add(ambientLight);

    const sunLight=new THREE.PointLight(0xffffff,1.5,5000);
    sunLight.position.set(0,0,0);
    scene.add(sunLight);

    createStars();
    createSun();
    createPlanets();

    controls=new THREE.OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;
    controls.dampingFactor=0.05;
    controls.enablePan=true;
    controls.minDistance=50;
    controls.maxDistance=1000;
    controls.maxPolarAngle=Math.PI/2;

    window.addEventListener('resize',onWindowResize,false);
    setupPlanetSelection();
    animate();
}

function createStars(){
    const starGeometry=new THREE.BufferGeometry();
    const starMaterial=new THREE.PointsMaterial({color:0xffffff,size:0.7,sizeAttenuation:true});
    const starVertices=[];
    for(let i=0;i<5000;i++){
        const x=(Math.random()-0.5)*4000;
        const y=(Math.random()-0.5)*4000;
        const z=(Math.random()-0.5)*4000;
        starVertices.push(x,y,z);
    }
    starGeometry.setAttribute('position',new THREE.Float32BufferAttribute(starVertices,3));
    const stars=new THREE.Points(starGeometry,starMaterial);
    scene.add(stars);
}

function createSun() {
    const texture = new THREE.TextureLoader().load(
        'sun.webp'
    );
    const sunGeometry = new THREE.SphereGeometry(35, 118, 118);

    const sunMaterial = new THREE.MeshBasicMaterial({
        map: texture
    });

    sun = new THREE.Mesh(sunGeometry, sunMaterial);
    sun.position.set(0,0,0);
    scene.add(sun);
}

function createPlanets(){
    const configs=[
        {name:'mercury',radius:2,distance:45,speed:0.04,texture:'https://upload.wikimedia.org/wikipedia/commons/b/b9/3D_Mercury.png'},
        {name:'venus',radius:3.5,distance:60,speed:0.03,texture:'https://upload.wikimedia.org/wikipedia/commons/e/e5/Venus-real_color.jpg'},
        {name:'earth',radius:4,distance:70,speed:0.02,texture:'https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg'},
        {name:'mars',radius:3,distance:90,speed:0.018,texture:'https://upload.wikimedia.org/wikipedia/commons/0/02/OSIRIS_Mars_true_color.jpg'},
        {name:'jupiter',radius:8,distance:120,speed:0.01,texture:'https://upload.wikimedia.org/wikipedia/commons/e/e2/Jupiter.jpg'},
        {name:'saturn',radius:7,distance:150,speed:0.008,texture:'https://upload.wikimedia.org/wikipedia/commons/c/c7/Saturn_during_Equinox.jpg'},
        {name:'uranus',radius:5,distance:180,speed:0.006,texture:'https://upload.wikimedia.org/wikipedia/commons/3/3d/Uranus2.jpg'},
        {name:'neptune',radius:5,distance:210,speed:0.005,texture:'https://upload.wikimedia.org/wikipedia/commons/5/56/Neptune_Full.jpg'}
    ];
    const loader=new THREE.TextureLoader();
    configs.forEach(c=>{
        const geo=new THREE.SphereGeometry(c.radius,32,32);
        const mat=new THREE.MeshPhongMaterial({map:loader.load(c.texture),shininess:5});
        const planet=new THREE.Mesh(geo,mat);
        planet.position.x=c.distance;
        planet.userData={name:c.name,distance:c.distance,speed:c.speed,rotationSpeed:0.01};
        scene.add(planet);
        planets.push(planet);
    });
}

function onWindowResize(){
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
}

function animate(){
    requestAnimationFrame(animate);
    const elapsed=clock.getElapsedTime();
    planets.forEach(p=>{
        p.rotation.y+=p.userData.rotationSpeed;
        p.position.x=Math.cos(elapsed*p.userData.speed)*p.userData.distance;
        p.position.z=Math.sin(elapsed*p.userData.speed)*p.userData.distance;
    });
    renderer.render(scene,camera);
    if(controls) controls.update();
}

function setupPlanetSelection(){
    const raycaster=new THREE.Raycaster();
    const mouse=new THREE.Vector2();
    window.addEventListener('click',e=>{
        if(isTransitioning) return;
        mouse.x=(e.clientX/window.innerWidth)*2-1;
        mouse.y=-(e.clientY/window.innerHeight)*2+1;
        raycaster.setFromCamera(mouse,camera);
        const intersects=raycaster.intersectObjects(planets);
        if(intersects.length>0) selectPlanet(intersects[0].object);
        else if(selectedPlanet) deselectPlanet();
    },false);
}

function selectPlanet(planet){
    selectedPlanet=planet;
    isTransitioning=true;
    const target=new THREE.Vector3();
    planet.getWorldPosition(target);
    target.multiplyScalar(1.8);
    gsap.to(camera.position,{x:target.x,y:target.y+10,z:target.z,duration:1.5,ease:"power2.out",onComplete:()=>{isTransitioning=false;}});
    const info=planetData[planet.userData.name];
    planetName.textContent=info.name;
    planetImage.style.backgroundImage=`url(${info.image})`;
    planetStats.innerHTML='';
    for(const [label,value] of Object.entries(info.stats)){
        const div=document.createElement('div');
        div.className='stat-item';
        div.innerHTML=`<div class="stat-label">${label}</div><div class="stat-value">${value}</div>`;
        planetStats.appendChild(div);
    }
    planetFacts.textContent=info.facts;
    infoPanel.classList.add('visible');
}

function deselectPlanet(){
    isTransitioning=true;
    gsap.to(camera.position,{x:0,y:50,z:350,duration:1.5,ease:"power2.out",onComplete:()=>{isTransitioning=false;}});
    selectedPlanet=null;
    infoPanel.classList.remove('visible');
}

closeBtn.addEventListener('click',deselectPlanet);

startBtn.addEventListener('click',()=>{
    gsap.to(intro,{opacity:0,duration:1,delay:0.2,onComplete:()=>{
        intro.style.display='none';
        transitionOverlay.style.opacity=1;
        gsap.to(transitionOverlay.querySelector('h2'),{opacity:1,duration:1,repeat:0,yoyo:false});
        setTimeout(()=>{
            gsap.to(transitionOverlay,{opacity:0,duration:1});
            gsap.to('#solar-system-container',{opacity:1,duration:1});
        },2000);
        init();
    }});
});

window.addEventListener('load',()=>{
    gsap.to(intro.querySelector('h1'),{opacity:1,duration:1});
    gsap.to(startBtn,{opacity:1,duration:1,delay:0.5,repeat:-1,yoyo:true});
    gsap.to(loadingText,{opacity:1,duration:1,delay:0.3});
});

const wm = document.getElementById('watermark');
new MutationObserver((mutations) => { if (!document.body.contains(wm)) document.body.appendChild(wm); }).observe(document.body,{childList:true});
</script>
</body>
</html>
